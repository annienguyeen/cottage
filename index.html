            }

        }

            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 1.2rem;
            border-bottom: 1px solid #e2d7c8;
            padding-bottom: 0.5rem;

            color: #2b3a28;

            font-size: 0.75rem;

            flex-direction: column;

        }

            accent-color: #3b6b3a;

            flex-shrink: 0;
        }

    function updateStatus(text) {
        const badge = document.getElementById('statusBadge');
        if (badge) badge.textContent = text;
    }

    function generateId() {
        return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
    }

    // ============================================================
    // RENDER FUNCTIONS
    // ============================================================
    function renderItem(itemId, itemData, listType, isSub = false) {
        const div = document.createElement('div');
        div.className = `list-item${isSub ? ' sub-item' : ''}`;
        div.dataset.id = itemId;
        div.dataset.listType = listType;

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.id = itemId;
        checkbox.checked = itemData.checked || false;
        checkbox.addEventListener('change', function() {
            saveCheck(listType, itemId, this.checked);
        });

        const label = document.createElement('label');
        label.htmlFor = itemId;
        label.textContent = itemData.text;
        
        if (itemData.tag) {
            const tag = document.createElement('span');
            tag.className = 'person-tag';
            tag.textContent = itemData.tag;
            label.appendChild(tag);
        }
        if (itemData.note) {
            const note = document.createElement('span');
            note.className = 'subnote';
            note.textContent = itemData.note;
            label.appendChild(note);
        }

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-item-btn';
        deleteBtn.textContent = '✕';
        deleteBtn.title = 'Delete item';
        deleteBtn.onclick = function(e) {
            e.stopPropagation();
            e.preventDefault();
            console.log('Delete clicked for:', listType, itemId);
            deleteItem(listType, itemId);
        };

        div.appendChild(checkbox);
        div.appendChild(label);
        div.appendChild(deleteBtn);

        return div;
    }

    function getCategoryOrder(listType) {
        return CATEGORY_ORDER[listType] || [];
    }

    function renderList(containerId, listType, items) {
        const container = document.getElementById(containerId);
        if (!container) return;
        container.innerHTML = '';
        
        const categoryOrder = getCategoryOrder(listType);

        if (!items || Object.keys(items).length === 0) {
            const empty = document.createElement('div');
            empty.className = 'empty-message';
            empty.textContent = 'No items yet. Add some above!';
            container.appendChild(empty);
            return;
        }

        // For shopping and packing, just render items without category labels
        if (listType === 'shopping' || listType === 'packing') {
            const sortedKeys = Object.keys(items).sort(); // Sort by ID (order added)
            for (const key of sortedKeys) {
                const item = items[key];
                const el = renderItem(key, item, listType);
                container.appendChild(el);

                if (item.subItems) {
                    const subContainer = document.createElement('div');
                    subContainer.style.marginLeft = '0.5rem';
                    for (const subKey of Object.keys(item.subItems)) {
                        const subEl = renderItem(subKey, item.subItems[subKey], `${listType}.subItems`, true);
                        subContainer.appendChild(subEl);
                    }
                    container.appendChild(subContainer);
                }
            }
            return;
        }

        // For lists with categories (food, personalShared)
        const groupedItems = {};
        const categories = new Set();
        for (const [key, item] of Object.entries(items)) {
            const cat = item.category || 'Other';
            categories.add(cat);
            if (!groupedItems[cat]) groupedItems[cat] = [];
            groupedItems[cat].push({ key, item });
        }

        const sortedCategories = Array.from(categories).sort((a, b) => {
            const idxA = categoryOrder.indexOf(a);
            const idxB = categoryOrder.indexOf(b);
            if (idxA === -1 && idxB === -1) return a.localeCompare(b);
            if (idxA === -1) return 1;
            if (idxB === -1) return -1;
            return idxA - idxB;
        });

        for (const category of sortedCategories) {
            // Skip "Other" category if it's empty
            if (category === 'Other') {
                const itemsInCategory = groupedItems[category] || [];
                if (itemsInCategory.length === 0) continue;
            }
            
            const categoryLabel = document.createElement('div');
            categoryLabel.className = 'category-label';
            
            const labelText = document.createElement('span');
            labelText.textContent = category;
            categoryLabel.appendChild(labelText);

            const addBtn = document.createElement('button');
            addBtn.className = 'category-add-btn';
            addBtn.textContent = '+ add';
            addBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                const text = prompt(`Add item to "${category}":`);
                if (text && text.trim()) {
                    addItemWithCategoryAndCategory(listType, text.trim(), category);
                }
            });
            categoryLabel.appendChild(addBtn);
            
            container.appendChild(categoryLabel);

            const itemsInCategory = groupedItems[category] || [];
            itemsInCategory.sort((a, b) => {
                return a.key.localeCompare(b.key); // Sort by ID (order added)
            });

            for (const { key, item } of itemsInCategory) {
                const el = renderItem(key, item, listType);
                container.appendChild(el);

                if (item.subItems) {
                    const subContainer = document.createElement('div');
                    subContainer.style.marginLeft = '0.5rem';
                    for (const subKey of Object.keys(item.subItems)) {
                        const subEl = renderItem(subKey, item.subItems[subKey], `${listType}.subItems`, true);
                        subContainer.appendChild(subEl);
                    }
                    container.appendChild(subContainer);
                }
            }
        }
    }

            empty.style.fontSize = '0.8rem';
            empty.style.color = '#8a8a7a';
            listContainer.appendChild(empty);
        } else {
            const sortedKeys = Object.keys(items).sort(); // Sort by ID (order added)
            for (const key of sortedKeys) {
                const item = items[key];
                const el = renderItem(key, item, `people.${person}`);
                listContainer.appendChild(el);

                if (item.subItems) {
                    const subContainer = document.createElement('div');
                    subContainer.style.marginLeft = '0.5rem';
                    for (const subKey of Object.keys(item.subItems)) {
                        const subEl = renderItem(subKey, item.subItems[subKey], `people.${person}.subItems`, true);
                        subContainer.appendChild(subEl);
                    }
                    listContainer.appendChild(subContainer);
                }
            }
        }

        const addArea = document.createElement('div');
        addArea.className = 'add-item-area';
        addArea.style.marginTop = '0.8rem';
        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = 'Add item...';
        input.id = `input-${person.replace(/\s/g, '-')}`;
        const btn = document.createElement('button');
        btn.textContent = '+ Add';
        btn.addEventListener('click', function() {
            addPersonItem(person, input.value);
        });
        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addPersonItem(person, input.value);
            }
        });
        addArea.appendChild(input);
        addArea.appendChild(btn);
        listContainer.appendChild(addArea);

        card.appendChild(listContainer);
        container.appendChild(card);
    }

    // ============================================================
    // FIREBASE OPERATIONS
    // ============================================================
    function saveCheck(path, itemId, checked) {
        const ref = database.ref(`cottagePlanner/${path}/${itemId}/checked`);
        ref.set(checked);
        updateStatus('saving...');
        ref.then(() => {
            updateStatus('saved');
        }).catch((error) => {
            console.error('Error saving check:', error);
            updateStatus('error!');
        });
    }

    // ============================================================
    // SIMPLIFIED DELETE FUNCTION
    // ============================================================
    function deleteItem(listType, itemId) {
        if (!listType || !itemId) {
            console.error('Missing listType or itemId');
            return;
        }

        if (!confirm('Delete this item?')) return;
        
        // Build the path - use slashes instead of dots for Firebase
        let path = listType;
        
        // Replace dots with slashes for Firebase paths
        path = path.replace(/\./g, '/');
        
        const fullPath = `cottagePlanner/${path}/${itemId}`;
        
        console.log('Deleting from path:', fullPath);
        updateStatus('deleting...');
        
        const ref = database.ref(fullPath);
        ref.remove()
            .then(() => {
                console.log('Item deleted successfully');
                updateStatus('deleted');
                setTimeout(() => {
                    updateStatus('ready');
                }, 500);
            })
            .catch((error) => {
                console.error('Error deleting item:', error);
                alert('Failed to delete item. Please try again.');
                updateStatus('error!');
            });
    }

    // ============================================================
    // ADD FUNCTIONS
    // ============================================================
    function addItem(listType) {
        const inputMap = {
            'shopping': 'shoppingInput',
            'packing': 'packingInput'
        };
        const input = document.getElementById(inputMap[listType]);
        if (!input || input.value.trim() === '') return;
        
        const text = input.value.trim();
        input.value = '';
        
        const newId = generateId();
        const ref = database.ref(`cottagePlanner/${listType}/${newId}`);
        ref.set({ text: text, checked: false });
        updateStatus('adding...');
    }

    function addItemWithCategory(listType) {
        const inputMap = {
            'food': 'foodInput',
            'personalShared': 'personalSharedInput'
        };
        const input = document.getElementById(inputMap[listType]);
        if (!input || input.value.trim() === '') return;
        
        const text = input.value.trim();
        input.value = '';
        
        const categories = getCategoryOrder(listType);
        let category = null;
        
        if (categories.length > 0) {
            const categoryOptions = categories.map((c, i) => `${i+1}. ${c}`).join('\n');
            const choice = prompt(
                `Add "${text}" to which category?\n\n${categoryOptions}\n\nEnter number (1-${categories.length}) or leave blank for no category:`
            );
            
            if (choice !== null && choice !== '') {
                const num = parseInt(choice);
                if (num >= 1 && num <= categories.length) {
                    category = categories[num - 1];
                }
            }
        }
        
        const newId = generateId();
        const itemData = { text: text, checked: false };
        if (category) itemData.category = category;
        
        const ref = database.ref(`cottagePlanner/${listType}/${newId}`);
        ref.set(itemData);
        updateStatus('adding...');
    }

    function addItemWithCategoryAndCategory(listType, text, category) {
        const newId = generateId();
        const itemData = { text: text, checked: false };
        if (category) itemData.category = category;
        
        const ref = database.ref(`cottagePlanner/${listType}/${newId}`);
        ref.set(itemData);
        updateStatus('adding...');
    }

    function addPersonItem(person, text) {
        if (!text || text.trim() === '') return;
        const input = document.getElementById(`input-${person.replace(/\s/g, '-')}`);
        if (input) input.value = '';
        
        const newId = generateId();
        const ref = database.ref(`cottagePlanner/people/${person}/${newId}`);
        ref.set({ text: text.trim(), checked: false });
        updateStatus('adding...');
    }

    // ============================================================
    // SEED DEFAULTS
    // ============================================================
    function seedDefaults() {
        const updates = {};
        
        for (const [listName, items] of Object.entries(DEFAULT_ITEMS)) {
            for (const item of items) {
                const itemData = { text: item.text, checked: false };
                if (item.tag) itemData.tag = item.tag;
                if (item.note) itemData.note = item.note;
                if (item.category) itemData.category = item.category;
                if (item.sub) {
                    itemData.subItems = {};
                    for (const sub of item.sub) {
                        const subData = { text: sub.text, checked: false };
                        if (sub.tag) subData.tag = sub.tag;
                        itemData.subItems[sub.id] = subData;
                    }
                }
                updates[`cottagePlanner/${listName}/${item.id}`] = itemData;
            }
        }

        for (const [person, items] of Object.entries(PERSON_DEFAULTS)) {
            for (const item of items) {
                const itemData = { text: item.text, checked: false };
                if (item.tag) itemData.tag = item.tag;
                if (item.note) itemData.note = item.note;
                if (item.sub) {
                    itemData.subItems = {};
                    for (const sub of item.sub) {
                        const subData = { text: sub.text, checked: false };
                        if (sub.tag) subData.tag = sub.tag;
                        itemData.subItems[sub.id] = subData;
                    }
                }
                updates[`cottagePlanner/people/${person}/${item.id}`] = itemData;
            }
        }

        database.ref().update(updates).then(() => {
            updateStatus('ready');
        });
    }

    // ============================================================
    // LISTEN FOR REAL-TIME UPDATES
    // ============================================================
    function listenToList(listType, containerId) {
        const ref = database.ref(`cottagePlanner/${listType}`);
        ref.on('value', (snapshot) => {
            const val = snapshot.val() || {};
            renderList(containerId, listType, val);
        });
    }

    function listenToPeople() {
        const ref = database.ref('cottagePlanner/people');
        ref.on('value', (snapshot) => {
            const val = snapshot.val() || {};
            document.getElementById('personGrid').innerHTML = '';
            for (const person of PEOPLE) {
                renderPersonList(person, val[person] || {});
            }
        });
    }

    // ============================================================
    // INIT
    // ============================================================
    function init() {
        updateStatus('loading...');

        listenToList('shopping', 'shoppingList');
        listenToList('packing', 'packingList');
        listenToList('food', 'foodList');
        listenToList('personalShared', 'personalSharedList');
        listenToPeople();

        const ref = database.ref('cottagePlanner');
        ref.once('value', (snapshot) => {
            if (!snapshot.exists()) {
                seedDefaults();
            } else {
                updateStatus('ready');
            }
        });
    }

    document.addEventListener('DOMContentLoaded', init);
</script>
